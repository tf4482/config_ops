[project]
name = "config_ops"
version = "0.1.0"
description = "Configuration-driven Windows automation: SMB, Robocopy, media archiving, file dates, and SSH."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "exif>=1.6.1",
    "pyyaml>=6.0.3",
]
keywords = [
    "automation",
    "backup",
    "configuration",
    "robocopy",
    "smb",
    "ssh",
    "windows",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
config_ops = "config_ops:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit",
    "pyinstaller",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
